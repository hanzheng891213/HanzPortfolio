<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" fill="#f5f5f5"/>
  <!-- Large document/page -->
  <rect x="56" y="20" width="200" height="240" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Document lines inside -->
  <rect x="76" y="48" width="120" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="76" y="72" width="160" height="6" rx="3" fill="#999"/>
