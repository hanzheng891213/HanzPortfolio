  <rect x="76" y="152" width="100" height="6" rx="3" fill="#bbb"/>
  <rect x="76" y="168" width="136" height="6" rx="3" fill="#999"/>
  <rect x="76" y="184" width="88" height="6" rx="3" fill="#bbb"/>
  <rect x="76" y="200" width="144" height="6" rx="3" fill="#999"/>
  <rect x="76" y="216" width="64" height="6" rx="3" fill="#bbb"/>
